name: Build and Release Password Generator

on:
  push:
    tags:
      - "v*" # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build with Maven
        run: mvn -B clean package

      - name: Create Windows App Image (.exe)
        run: |
          jpackage --name "PasswordGenerator" `
                   --input target `
                   --main-jar PasswordGenerator.jar `
                   --main-class com.francismul.passwordgenerator.AppGui `
                   --type app-image `
                   --dest dist `
                   --vendor "Francis Mule" `
                   --description "Password Generator Application" `

      - name: Create Windows Installer (.msi)
        run: |
          jpackage --name "PasswordGenerator" `
                   --input target `
                   --main-jar PasswordGenerator.jar `
                   --main-class com.francismul.passwordgenerator.AppGui `
                   --type msi `
                   --dest dist `
                   --vendor "Francis Mule" `
                   --description "Password Generator Application" `
                   --win-menu `
                   --win-shortcut

      - name: Zip the executable folder
        run: |
          Compress-Archive -Path "dist\PasswordGenerator" -DestinationPath "PasswordGenerator-Portable.zip"

      - name: Get release info
        id: release_info
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match "^v?(\d+\.\d+\.\d+)") {
            echo "version=$($matches[1])" >> $env:GITHUB_OUTPUT
            echo "tag=$tag" >> $env:GITHUB_OUTPUT
          } else {
            $date = Get-Date -Format "yyyy-MM-dd-HHmm"
            echo "version=dev-$date" >> $env:GITHUB_OUTPUT
            echo "tag=dev-$date" >> $env:GITHUB_OUTPUT
          }

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Password Generator v${{ steps.release_info.outputs.version }}
          body: |
            ## 🚀 Password Generator v${{ steps.release_info.outputs.version }}

            ### 🎉 What's New in v6.0.0
            - � **Persistent Password History** - All passwords saved across sessions
            - 🔒 **Master Password Protection** - Secure access to your history
            - 📊 **Enhanced History Viewer** - Beautiful timeline of all generated passwords
            - 💾 **Export Feature** - Save your history to file
            - 🛡️ **SHA-256 Security** - Master password stored with cryptographic hashing

            For complete changelog, see [CHANGELOG.md](https://github.com/francismul/Password-Generator/blob/main/CHANGELOG.md)

            ### �📥 Downloads
            - **PasswordGenerator.msi** – Windows Installer (**Recommended**)  
              Installs the app system-wide with Start Menu & desktop shortcut.
            - **PasswordGenerator-Portable.zip** – Portable Version (**No Installation**)  
              Extract and run. Perfect for USB drives or quick use.
            - **PasswordGenerator.jar** – GUI Version (requires Java 21+)  
              Run with: `java -jar PasswordGenerator.jar`
            - **password-generator-Console.jar** – Console Version (requires Java 21+)  
              Run with: `java -jar password-generator-Console.jar`

            ### ✨ Core Features
            - Modern GUI Password Generator with dark/light themes
            - Password strength indicator with entropy calculation
            - Persistent password history with master password protection
            - Customizable character sets (uppercase, lowercase, numbers, symbols)
            - Password length slider (4-40 characters)
            - Copy to clipboard & export functionality
            - Animated password reveal with glitch effects

            ### 🖥️ Requirements
            - **.msi / .exe**: No additional requirements
            - **.jar** files: Java 21 or later installed

            ### 📝 Important Notes
            - **First Run**: You'll be prompted to set a master password for history access
            - **Storage**: History stored in `~/.passwordgenerator/` directory
            - **Security**: Master password uses SHA-256 + salt hashing
          files: |
            dist/*.msi
            PasswordGenerator-Portable.zip
            target/PasswordGenerator.jar
            target/password-generator-Console.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
